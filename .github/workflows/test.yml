name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install libpq
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Build
        run: cargo build --workspace
      - name: Run tests (without external deps)
        run: cargo test -p event-message -p procedural_event -p redis-serde -p config-registry -p utils
